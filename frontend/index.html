<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Агуулах — Бараа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Барааны бүртгэл</h1>

    <!-- L14: өгөгдлийн эх сурвалж (HTTP туршилт) -->
    <section aria-labelledby="load-title">
      <h2 id="load-title">Өгөгдөл ачаалах</h2>
      <div class="row">
        <label for="source">Эх сурвалж</label>
        <select id="source">
          <option value="data/products.json">Амжилттай (products.json)</option>
          <option value="data/empty.json">Хоосон (empty.json)</option>
          <option value="data/missing.json">404 (missing.json)</option>
          <option value="data/broken.json">JSON эвдэрсэн (broken.json)</option>
          <option value="http://127.0.0.1:59999/products.json">Сүлжээ тасарсан</option>
        </select>
        <button type="button" id="load-btn">Ачаалах</button>
      </div>
    </section>

    <!-- L13: бараа нэмэх форм -->
    <section aria-labelledby="form-title">
      <h2 id="form-title">Бараа нэмэх</h2>
      <form id="product-form" novalidate>
        <div class="field">
          <label for="sku">SKU <span aria-hidden="true">*</span></label>
          <input id="sku" name="sku" autocomplete="off" required maxlength="30" aria-describedby="sku-hint sku-error">
          <small id="sku-hint">Жишээ: P06. Үсэг, тоо, зураас.</small>
          <p id="sku-error" class="error" role="alert"></p>
        </div>
        <div class="field">
          <label for="name">Нэр <span aria-hidden="true">*</span></label>
          <input id="name" name="name" autocomplete="off" required maxlength="150" aria-describedby="name-error">
          <p id="name-error" class="error" role="alert"></p>
        </div>
        <div class="field">
          <label for="unit">Нэгж</label>
          <select id="unit" name="unit">
            <option>ширхэг</option>
            <option>боодол</option>
            <option>хайрцаг</option>
          </select>
        </div>
        <button type="submit">Нэмэх</button>
      </form>
    </section>

    <!-- Жагсаалт -->
    <section aria-labelledby="list-title">
      <h2 id="list-title">Бараанууд</h2>
      <div class="row">
        <label for="search">Хайх</label>
        <input id="search" type="search" placeholder="Нэр эсвэл SKU">
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <table id="product-table">
        <thead>
          <tr><th scope="col">SKU</th><th scope="col">Нэр</th><th scope="col">Нэгж</th></tr>
        </thead>
        <tbody id="product-rows"></tbody>
      </table>
    </section>
  </main>

  <script src="stock.js"></script>
  <script src="app.js"></script>
</body>
</html>
